<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hill Climb Racing - Telegram Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #87CEEB; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        
        /* Boshqaruv tugmalari */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; pointer-events: none; }
        .btn { 
            width: 80px; height: 80px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 3px solid rgba(255,255,255,0.6);
            border-radius: 50%; 
            color: white; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { background: rgba(255, 69, 0, 0.8); transform: scale(0.95); }

        /* Interfeys: Yoqilg'i va Masofa */
        .ui { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
        .fuel-container { width: 100%; height: 22px; background: rgba(0,0,0,0.5); border-radius: 10px; border: 2px solid white; overflow: hidden; position: relative; }
        .fuel-bar { height: 100%; background: #00ff00; width: 100%; transition: background 0.3s; }
        .fuel-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        .score { text-align: center; color: white; font-size: 22px; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

        /* O'yin tugashi ekrani */
        #gameOver {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 10;
        }
        #gameOver h1 { font-size: 36px; color: #ff4757; margin-bottom: 10px; }
        #gameOver p { font-size: 20px; margin-bottom: 20px; }
        .restart-btn {
            padding: 15px 30px; background: #2ed573; border: none; border-radius: 8px;
            color: white; font-size: 20px; font-weight: bold; cursor: pointer;
        }
        .restart-btn:active { transform: scale(0.95); background: #27ae60; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui">
        <div class="score"><span id="distText">0</span> m</div>
        <div class="fuel-container">
            <div class="fuel-bar" id="fuelBar"></div>
            <div class="fuel-text">Yoqilg'i</div>
        </div>
    </div>

    <div class="controls">
        <div class="btn" id="btnBrake">Tormoz</div>
        <div class="btn" id="btnGas">Gaz</div>
    </div>

    <div id="gameOver">
        <h1 id="deadReason">Avariya!</h1>
        <p>Masofa: <span id="finalScore">0</span> m</p>
        <button class="restart-btn" onclick="initGame()">Qayta boshlash</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Ekranga moslashtirish
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        // Tugmalar holati
        const keys = { gas: false, brake: false };
        const btnGas = document.getElementById("btnGas");
        const btnBrake = document.getElementById("btnBrake");

        const bindBtn = (el, key) => {
            el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener("mousedown", () => keys[key] = true);
            el.addEventListener("mouseup", () => keys[key] = false);
        };
        bindBtn(btnGas, "gas");
        bindBtn(btnBrake, "brake");

        // O'yin parametrlari
        let rw, fw; // Orqa va Old g'ildiraklar (Rear Wheel, Front Wheel)
        let wheelDist = 70; // G'ildiraklar orasi
        let gravity = 0.45;
        let power = 0.8; // Motor kuchi
        let fuel, distance, maxDistance, isDead;
        let collectedCans = {};
        let cameraX = 0, cameraY = 0;

        // Yo'lning baland-pastligi (Matematik to'lqinlar yordamida uzluksiz yo'l generatsiyasi)
        function getTerrain(x) {
            return Math.sin(x * 0.005) * 80 + 
                   Math.sin(x * 0.002) * 150 + 
                   Math.sin(x * 0.01) * 30 + 400;
        }

        function initGame() {
            document.getElementById("gameOver").style.display = "none";
            fuel = 100;
            distance = 0;
            maxDistance = 0;
            isDead = false;
            collectedCans = {};
            
            // Mashinani boshlang'ich joyga qoyish
            let startY = getTerrain(100) - 30;
            rw = { x: 100, y: startY, oldx: 100, oldy: startY };
            fw = { x: 100 + wheelDist, y: getTerrain(100 + wheelDist) - 30, oldx: 100 + wheelDist, oldy: getTerrain(100 + wheelDist) - 30 };
            
            cameraX = rw.x - canvas.width / 4;
            cameraY = rw.y - canvas.height / 2;
            
            gameLoop();
        }

        // Verlet fizikasi: Nuqtani yangilash
        function updatePoint(p) {
            let vx = (p.x - p.oldx) * 0.99; // Havo qarshiligi
            let vy = (p.y - p.oldy) * 0.99;
            p.oldx = p.x;
            p.oldy = p.y;
            p.x += vx;
            p.y += vy + gravity;
        }

        // Verlet fizikasi: G'ildiraklar orasidagi masofani qattiq ushlab turish (Kuzov)
        function constrain(p1, p2, target) {
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.hypot(dx, dy);
            if (dist === 0) return;
            let diff = ((target - dist) / dist) * 0.5;
            let ox = dx * diff;
            let oy = dy * diff;
            p1.x -= ox; p1.y -= oy;
            p2.x += ox; p2.y += oy;
        }

        // Yer bilan to'qnashuvni tekshirish
        function collide(p) {
            let t = getTerrain(p.x);
            let onGround = false;
            if (p.y + 15 > t) { // 15 - g'ildirak radiusi
                p.y = t - 15;
                // Yerga tekkanda oldingi tezlikni (oldx) sekinlashtirish - Ishqalanish
                let vx = p.x - p.oldx;
                p.oldx = p.x - vx * 0.7; 
                p.oldy = p.y; // Sakrashni to'xtatish
                onGround = true;
            }
            return onGround;
        }

        function die(reason) {
            if (isDead) return;
            isDead = true;
            document.getElementById("gameOver").style.display = "flex";
            document.getElementById("deadReason").innerText = reason;
            document.getElementById("finalScore").innerText = Math.floor(maxDistance / 10);
        }

        function update() {
            if (isDead) return;

            // Yoqilg'i mantiqi
            if (keys.gas || keys.brake) fuel -= 0.08;
            fuel -= 0.02; // Dvigatel yoniq turgani uchun sarf

            if (fuel <= 0) {
                fuel = 0;
                die("Yoqilg'i tugadi!");
            }

            // G'ildiraklarni tortishish kuchi bo'yicha siljitish
            updatePoint(rw);
            updatePoint(fw);

            // Fizika stabil bo'lishi uchun chegaralarni bir necha marta mustahkamlaymiz
            for(let i=0; i<3; i++) constrain(rw, fw, wheelDist);
            let rg = collide(rw); // Orqa g'ildirak yerdami?
            let fg = collide(fw); // Old g'ildirak yerdami?
            for(let i=0; i<3; i++) constrain(rw, fw, wheelDist);

            // Mashina burchagi
            let angle = Math.atan2(fw.y - rw.y, fw.x - rw.x);

            // Boshqaruv (Gaz va Tormoz)
            if (keys.gas) {
                if (rg || fg) { // Yerdamiz, olg'a yuramiz
                    rw.oldx -= Math.cos(angle) * power;
                    rw.oldy -= Math.sin(angle) * power;
                    fw.oldx -= Math.cos(angle) * power;
                } else { // Havoda aylanib ketish (Wheelie / Orqaga og'ish)
                    fw.oldy += power * 0.4;
                    rw.oldy -= power * 0.4;
                }
            }
            if (keys.brake) {
                if (rg || fg) { // Tormoz / Orqaga yurish
                    rw.oldx += Math.cos(angle) * power;
                    rw.oldy += Math.sin(angle) * power;
                    fw.oldx += Math.cos(angle) * power;
                } else { // Havoda oldinga og'ish
                    fw.oldy -= power * 0.4;
                    rw.oldy += power * 0.4;
                }
            }

            // Mashina tomiga o'girilib qolsa va yerga tegsa - O'lim
            let mx = (rw.x + fw.x) / 2;
            let my = (rw.y + fw.y) / 2;
            let roofX = mx - Math.sin(angle) * 35; // Mashina tomi X
            let roofY = my - Math.cos(angle) * 35; // Mashina tomi Y
            
            if (roofY > getTerrain(roofX) - 5) {
                die("Bo'yningiz sindi! ☠️");
            }

            // Masofa hisobi
            if (rw.x > maxDistance) maxDistance = rw.x;
            document.getElementById("distText").innerText = Math.floor(maxDistance / 10);
            
            // Yoqilg'i barini yangilash
            let fBar = document.getElementById("fuelBar");
            fBar.style.width = fuel + "%";
            if (fuel > 50) fBar.style.background = "#2ed573";
            else if (fuel > 20) fBar.style.background = "#ffa502";
            else fBar.style.background = "#ff4757";

            // Yoqilg'i idishlarini (Kanonlarni) yig'ish (Har 1500 px da bitta chiqadi)
            let chunk = Math.floor(mx / 1200);
            let canX = chunk * 1200 + 800;
            let canY = getTerrain(canX) - 25;
            
            if (chunk > 0 && !collectedCans[chunk]) {
                // Yaqinlashsa oladi
                if (Math.hypot(mx - canX, my - canY) < 60) {
                    collectedCans[chunk] = true;
                    fuel = Math.min(100, fuel + 40); // 40% benzin qo'shiladi
                }
            }

            // Kamerani mashinaga ergashishi
            cameraX += (mx - canvas.width / 4 - cameraX) * 0.1;
            cameraY += (my - canvas.height / 2 + 50 - cameraY) * 0.1;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Orqa fon tog'lar (Parallax)
            ctx.fillStyle = "#a4b0be";
            ctx.beginPath();
            for (let i = 0; i < canvas.width; i+=50) {
                let px = i + (cameraX * 0.2) % 200;
                ctx.lineTo(i, Math.sin(px * 0.01) * 100 + 250 - cameraY * 0.1);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Tuproq yo'lni chizish (Terrain)
            ctx.fillStyle = "#8B4513"; // Jigarrang tuproq
            ctx.beginPath();
            ctx.moveTo(cameraX - 100, cameraY + canvas.height + 100);
            for (let x = cameraX - 100; x < cameraX + canvas.width + 100; x += 20) {
                ctx.lineTo(x, getTerrain(x));
            }
            ctx.lineTo(cameraX + canvas.width + 100, cameraY + canvas.height + 100);
            ctx.fill();

            // Yashil o't qoplamasi (Maysa)
            ctx.strokeStyle = "#2ed573";
            ctx.lineWidth = 12;
            ctx.beginPath();
            for (let x = cameraX - 100; x < cameraX + canvas.width + 100; x += 20) {
                ctx.lineTo(x, getTerrain(x));
            }
            ctx.stroke();

            // Yoqilg'i idishlarini chizish
            let mx = (rw.x + fw.x) / 2;
            let startChunk = Math.floor(cameraX / 1200);
            for (let i = startChunk; i < startChunk + 3; i++) {
                if (i > 0 && !collectedCans[i]) {
                    let cx = i * 1200 + 800;
                    let cy = getTerrain(cx) - 25;
                    ctx.fillStyle = "#ff4757";
                    ctx.fillRect(cx - 10, cy - 15, 20, 30);
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 12px Arial";
                    ctx.fillText("GAS", cx - 12, cy + 5);
                }
            }

            // Mashinani chizish
            let cx = (rw.x + fw.x) / 2;
            let cy = (rw.y + fw.y) / 2;
            let angle = Math.atan2(fw.y - rw.y, fw.x - rw.x);

            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // Mashina kuzovi (Jeep dizayni)
            ctx.fillStyle = "#eccc68"; // Sariq rangli mashina
            ctx.fillRect(-45, -25, 90, 25); // Asosiy kuzov
            ctx.fillStyle = "#ff7f50";
            ctx.fillRect(-20, -50, 45, 25); // Kabina (tom)
            
            // Oyna
            ctx.fillStyle = "#7bed9f";
            ctx.fillRect(5, -45, 15, 18);

            // Haydovchining oddiy boshi
            ctx.fillStyle = "#ffb8b8";
            ctx.beginPath(); ctx.arc(-5, -35, 8, 0, Math.PI*2); ctx.fill();

            ctx.rotate(-angle);
            ctx.translate(-cx, -cy);

            // G'ildiraklarni chizish (Aylanadigan)
            let drawWheel = (w) => {
                ctx.save();
                ctx.translate(w.x, w.y);
                ctx.rotate(w.x * 0.05); // Yurganiga qarab aylanadi
                ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); 
                ctx.fillStyle = "#2f3542"; ctx.fill(); // Shina
                ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff"; ctx.stroke(); // Disk
                // Disk ichidagi chiziqlar (aylanishni bilish uchun)
                ctx.fillStyle = "#dfe4ea";
                ctx.fillRect(-2, -15, 4, 30);
                ctx.fillRect(-15, -2, 30, 4);
                ctx.restore();
            };

            drawWheel(rw);
            drawWheel(fw);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            if (!isDead) {
                requestAnimationFrame(gameLoop);
            }
        }

        initGame();
    </script>
</body>
</html>
