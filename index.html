<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dead Cells 2D - Dark Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body {
            background: #090a0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #0f111a;
            border: 2px solid #ff0055;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 460px;
            height: auto;
        }

        /* Boshqaruv tugmalari - Glassmorphism UI */
        #controls {
            width: 100%;
            max-width: 460px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        .btn-group { display: flex; gap: 12px; }

        .btn {
            width: 62px;
            height: 62px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .btn:active {
            transform: scale(0.92);
            background: rgba(0, 240, 255, 0.3);
            border-color: #00f0ff;
            box-shadow: 0 0 20px #00f0ff;
        }

        .btn-attack {
            background: rgba(255, 0, 85, 0.2);
            border-color: rgba(255, 0, 85, 0.5);
        }

        .btn-attack:active {
            background: rgba(255, 0, 85, 0.6);
            border-color: #ff0055;
            box-shadow: 0 0 25px #ff0055;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="460" height="300"></canvas>

        <div id="controls">
            <div class="btn-group">
                <div class="btn" id="btnLeft">◀</div>
                <div class="btn" id="btnRight">▶</div>
            </div>
            <div class="btn-group">
                <div class="btn" id="btnJump">▲</div>
                <div class="btn btn-attack" id="btnAttack">⚔️</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // O'yin effekti: Ekran titrashi
        let shakeTime = 0;

        // Zarrachalar tizimi (Particles)
        let particles = [];
        let floatingTexts = [];

        function addParticle(x, y, color, count = 5) {
            for(let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 20
                });
            }
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, opacity: 1, vy: -1.5 });
        }

        // Personaj (Ritsar)
        const player = {
            x: 60, y: 180, w: 26, h: 42,
            vx: 0, vy: 0,
            speed: 4, jumpPower: -10,
            gravity: 0.5,
            isGrounded: false,
            hp: 100, maxHp: 100,
            isAttacking: false,
            attackTimer: 0,
            direction: 1,
            kills: 0
        };

        // Dushman (Monster)
        let enemy = {
            x: 340, y: 180, w: 30, h: 42,
            hp: 60, maxHp: 60,
            speed: 1.2, direction: -1,
            hitTimer: 0
        };

        const keys = {};

        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        function setupBtn(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener("mousedown", () => keys[key] = true);
            btn.addEventListener("mouseup", () => keys[key] = false);
        }

        setupBtn("btnLeft", "ArrowLeft");
        setupBtn("btnRight", "ArrowRight");
        setupBtn("btnJump", "Space");
        setupBtn("btnAttack", "KeyZ");

        function update() {
            // Harakat
            if (keys["ArrowLeft"] || keys["KeyA"]) { player.vx = -player.speed; player.direction = -1; }
            else if (keys["ArrowRight"] || keys["KeyD"]) { player.vx = player.speed; player.direction = 1; }
            else { player.vx = 0; }

            // Sakrash
            if ((keys["Space"] || keys["ArrowUp"]) && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                addParticle(player.x + player.w/2, player.y + player.h, "#00f0ff", 8);
            }

            // Hujum
            if (keys["KeyZ"] && !player.isAttacking) {
                player.isAttacking = true;
                player.attackTimer = 12;
            }

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            // Fizika
            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Platforma (Zamin)
            const groundY = 220;
            if (player.y + player.h >= groundY) {
                player.y = groundY - player.h;
                player.vy = 0;
                player.isGrounded = true;
            }

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            // Dushman harakati
            enemy.x += enemy.speed * enemy.direction;
            if (enemy.x <= 120 || enemy.x >= 380) enemy.direction *= -1;

            // Hujum zarbasi
            if (player.isAttacking && player.attackTimer === 8) {
                const swordRange = player.direction === 1 
                    ? (player.x + player.w < enemy.x && player.x + player.w + 45 > enemy.x)
                    : (player.x > enemy.x && player.x - 45 < enemy.x + enemy.w);

                if (swordRange && Math.abs(player.y - enemy.y) < 35) {
                    const dmg = Math.floor(Math.random() * 10) + 20;
                    enemy.hp -= dmg;
                    enemy.hitTimer = 10;
                    shakeTime = 8; // Ekran qimirlaydi

                    addParticle(enemy.x + enemy.w/2, enemy.y + enemy.h/2, "#ff0055", 15);
                    addFloatingText(enemy.x, enemy.y - 10, `-${dmg}`, "#ff0055");

                    if (enemy.hp <= 0) {
                        player.kills++;
                        addFloatingText(enemy.x, enemy.y - 20, "KILL!", "#00f0ff");
                        enemy.x = 380;
                        enemy.hp = enemy.maxHp;
                    }
                }
            }

            // Dushman bilan to'qnashuv
            if (Math.abs(player.x - enemy.x) < 22 && Math.abs(player.y - enemy.y) < 25) {
                player.hp -= 0.6;
                shakeTime = 3;
                addParticle(player.x + player.w/2, player.y + player.h/2, "#ff0000", 2);

                if (player.hp <= 0) {
                    alert("☠️ Mag'lub bo'ldingiz!");
                    player.hp = player.maxHp;
                    player.x = 60;
                    player.kills = 0;
                }
            }

            // Zarrachalarni yangilash
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            });

            // Matnlarni yangilash
            floatingTexts.forEach((ft, i) => {
                ft.y += ft.vy;
                ft.opacity -= 0.03;
                if(ft.opacity <= 0) floatingTexts.splice(i, 1);
            });

            if (shakeTime > 0) shakeTime--;
        }

        function draw() {
            ctx.save();

            // Ekran titrashi (Shake Effect)
            if (shakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
            }

            // Qorong'u Zindon Foni
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, "#0a0c14");
            bgGrad.addColorStop(1, "#151928");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fon zarrachalari (Mash'ala uchqunlari)
            if(Math.random() < 0.2) {
                particles.push({
                    x: Math.random() * canvas.width, y: 220,
                    vx: (Math.random() - 0.5) * 1, vy: -Math.random() * 2 - 0.5,
                    size: Math.random() * 2, color: "rgba(255, 150, 0, 0.5)", life: 40
                });
            }

            // Zamin (Plitka uslubidagi platforma)
            ctx.fillStyle = "#1e2436";
            ctx.fillRect(0, 220, canvas.width, 80);
            ctx.fillStyle = "#00f0ff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00f0ff";
            ctx.fillRect(0, 220, canvas.width, 3);
            ctx.shadowBlur = 0; // reset

            // Dushman (Monster)
            if (enemy.hitTimer > 0) {
                enemy.hitTimer--;
                ctx.fillStyle = "#ffffff"; // Urganda oq yoqilishi
            } else {
                ctx.fillStyle = "#ff0055";
            }
            ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);

            // Dushman HP Chizig'i
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(enemy.x, enemy.y - 10, enemy.w, 4);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(enemy.x, enemy.y - 10, (enemy.hp / enemy.maxHp) * enemy.w, 4);

            // Personaj (Ritsar)
            // Tanasi
            ctx.fillStyle = "#1b2838";
            ctx.fillRect(player.x, player.y + 12, player.w, player.h - 12);
            
            // Plash / Sharf
            ctx.fillStyle = "#ff0055";
            const scarfX = player.direction === 1 ? player.x - 8 : player.x + player.w;
            ctx.fillRect(scarfX, player.y + 14, 10, 18);

            // Boshidagi Neon Olov (Dead Cells Beheaded uslubi)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f0ff";
            ctx.fillStyle = "#00f0ff";
            ctx.beginPath();
            ctx.arc(player.x + player.w/2, player.y + 8, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Qilich Hujumi Effekti (Neon Trail)
            if (player.isAttacking) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#00f0ff";
                ctx.strokeStyle = "#00f0ff";
                ctx.lineWidth = 4;
                ctx.beginPath();
                const arcX = player.direction === 1 ? player.x + player.w : player.x;
                ctx.arc(arcX, player.y + 18, 30, player.direction === 1 ? -Math.PI/3 : Math.PI*2/3, player.direction === 1 ? Math.PI/3 : Math.PI*4/3);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Zarrachalarni chizish
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            // Suzuvchi Zarba Matnlari
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.font = "bold 14px sans-serif";
                ctx.fillText(ft.text, ft.x, ft.y);
            });

            // HUD / Health & Score
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(12, 12, 140, 32);
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.strokeRect(12, 12, 140, 32);

            // Salomatlik bari
            ctx.fillStyle = "#00f0ff";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#00f0ff";
            ctx.fillRect(18, 18, (player.hp / player.maxHp) * 128, 8);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText(`KILLS: ${player.kills}`, 18, 38);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
